# Local development dependencies for StayBoost.
# Usage: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stayboost
      POSTGRES_PASSWORD: stayboost
      POSTGRES_DB: stayboost
    ports:
      - "5432:5432"
    volumes:
      - stayboost_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayboost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  workers:
    build:
      context: ..
      dockerfile: services/workers/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stayboost:stayboost@postgres:5432/stayboost
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stayboost_pg:
